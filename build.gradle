plugins {
    id "io.freefair.lombok" version "8.13"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'org.ajoberstar.grgit' version '5.2.2'
    id 'net.neoforged.gradle.userdev' version '7.0.190'
}

apply plugin: 'maven-publish'
apply plugin: 'eclipse'

def env = System.getenv()
def buildId = env.GITHUB_RUN_NUMBER ?: grgit.head().abbreviatedId

version = "MC${minecraft_version}-${project.mod_version}+$buildId"
group = "com.tterrag.registrate"
base.archivesName = "Registrate-LT"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES,REGISTRYDUMP'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.test
        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run')
    }

    server {
        workingDirectory project.file('run/server')
        arguments '--nogui'
    }

    clientData {
        workingDirectory project.file('run')

        arguments '--mod', 'testmod', '--all', '--output', rootProject.file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('src/test/resources').getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.7.2"
    testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:5.7.2"
}

lombok {
    version = "1.18.36"
}

delombok {
    format = [
        'suppressWarnings': 'skip',
        'javaLangAsFQN': 'skip'
    ]
}

jar {
    exclude('assets/**', 'data/**', '.cache/**') // Exclude generated assets, can't find a better way to do this :(
    manifest {
        attributes(
            'FMLModType': 'GAMELIBRARY'
        )
    }
}

tasks.register('sourceJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.delombokTask
    exclude 'com.tterrag.registrate.test.*'
}

javadoc {
    source = delombok
    configure (options) {
        tags(
           'apiNote:a:API Note:',
           'implNote:a:Implementation Note:'
        )
    }
}

publishing {
    tasks.publish.dependsOn 'build'
    tasks.publishToMavenLocal.dependsOn 'build'

    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourceJar
        }
    }

    repositories {
        if (env.MAVEN_URL) {
            maven {
                credentials {
                    username env.MAVEN_USERNAME
                    password env.MAVEN_PASSWORD
                }
                url env.MAVEN_URL
            }
        } else {
            mavenLocal()
        }
    }
}
